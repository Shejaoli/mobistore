kind = "web"
previewPath = "/"
title = "UNIQLO Men’s Collection"
description = "A locally editable recreation of the UNIQLO US men’s shopping page, built as a reference for redesign work."
version = "1.0.0"
id = "artifacts/uniqlo-men-redesign"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20876

[services.development]
run = "pnpm --filter @workspace/uniqlo-men-redesign run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/uniqlo-men-redesign", "run", "build" ]
serve = "static"
publicDir = "artifacts/uniqlo-men-redesign/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20876"
BASE_PATH = "/"
